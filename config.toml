# 烟波蓝日志 — Zola 站点配置（由 Hexo/nexmoe 迁移）
base_url = "https://yuris.site"
title = "烟波蓝日志"
description = "你会写代码有什么用？出来混要有势力，要有背景；你混哪个道的？哼，原来是小瘪三"
author = "yanbolan"
default_language = "zh"
theme = "helloblog"
compile_sass = false
minify_html = false
generate_feeds = true
build_search_index = false

taxonomies = [{ name = "tags" }]

[markdown.highlighting]
theme = "github-dark"
style = "inline"

# ---------- 站点参数 ----------
[extra]
keywords = ["生死看淡"]
images = ["background.jpg"]
color_theme = "sakura"
glass_opacity = 0.5
siteage = "2019-05-30"
avatar = "avatar.png"
saying = ""
copyright = "2024-2026 烟波蓝日志"

[extra.index]
logo = "烟波蓝日志"
welcome = ["欢迎来到烟波蓝日志", "你混哪个道的？哼，原来是小瘪三"]
increase_speed = 60
decrease_speed = 40
loop_speed = 1000
particle_enable = true
particle_distance = 180

[extra.background]
enable = true
image = "background.jpg"
overlay_dark = 0.6
overlay_light = 0.5

# 评论：giscus 暂不启用（用户决定）
[extra.giscus]
enable = false
repo = ""
repo_id = ""
category = "General"
category_id = ""
mapping = "pathname"

[[extra.menu]]
key = "nav.posts"
name = "文章"
path = "posts/"
icon = "posts"
[[extra.menu]]
key = "nav.category"
name = "归档"
path = "category/"
icon = "category"
[[extra.menu]]
key = "nav.link"
name = "朋友"
path = "link/"
icon = "link"
[[extra.menu]]
key = "nav.tags"
name = "标签"
path = "tags/"
icon = "tags"
[[extra.menu]]
key = "nav.about"
name = "关于"
path = "about/"
icon = "about"

[extra.language_names]
zh = "中文"

# ---------- 多语言（仅中文） ----------
[languages.zh]

